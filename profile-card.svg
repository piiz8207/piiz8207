<svg width="840" height="540" viewBox="0 0 840 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .header-sub1  { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 13.5px; font-style: italic; fill: #cbd5e1; text-anchor: middle; }
      .header-sub2  { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 13px; font-style: italic; fill: #94a3b8; text-anchor: middle; }
      .mono-title   { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13.5px; font-weight: 700; fill: #d4af37; }
      .mono-label   { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .mono-val     { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- ==================== 1. TOP HEADER CARD (CENTERED) ==================== -->
  <rect x="15" y="15" width="810" height="170" rx="10" fill="#090d16" stroke="#d4af37" stroke-width="1.4" />

  <!-- Title -->
  <text x="420" y="68" class="header-title">
    Hello, there! 👋
  </text>
  
  <!-- Centered Divider -->
  <line x1="170" y1="88" x2="670" y2="88" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5" />

  <!-- Subtitle / Bio -->
  <text x="420" y="116" class="header-sub1">
    "I'm <tspan font-weight="700" fill="#ffffff">Hafizh Sparta</tspan>, but you can call me <tspan font-weight="700" fill="#ffffff">Kokusei</tspan>."
  </text>
  <text x="420" y="138" class="header-sub2">
    Surviving as an impromptu IT undergrad by day,
  </text>
  <text x="420" y="158" class="header-sub2">
    and side-questing as a multimedia translator by night.
  </text>

  <!-- ==================== 2. BOTTOM LEFT: BIO PORTAL ==================== -->
  <rect x="15" y="200" width="280" height="320" rx="10" fill="#090d16" stroke="#d4af37" stroke-width="1.4" />

  <!-- Row 1: Name -->
  <text x="35" y="244" fill="#d4af37" font-size="14">✦</text>
  <text x="55" y="244" class="mono-label">Name</text>
  <text x="155" y="244" class="mono-val">Kokusei</text>

  <!-- Row 2: Pronoun -->
  <text x="35" y="292" fill="#d4af37" font-size="14">✦</text>
  <text x="55" y="292" class="mono-label">Pronoun</text>
  <text x="155" y="292" class="mono-val">he/him</text>

  <!-- Row 3: Platform -->
  <text x="35" y="340" fill="#d4af37" font-size="14">✦</text>
  <text x="55" y="340" class="mono-label">Platform</text>
  <text x="155" y="340" class="mono-val">PC & Mobile</text>

  <!-- Row 4: Region -->
  <text x="35" y="388" fill="#d4af37" font-size="14">✦</text>
  <text x="55" y="388" class="mono-label">Region</text>
  <text x="155" y="388" class="mono-val">SEA</text>

  <!-- Row 5: Playstyle -->
  <text x="35" y="436" fill="#d4af37" font-size="14">✦</text>
  <text x="55" y="436" class="mono-label">Playstyle</text>
  <text x="155" y="436" class="mono-val">Casual</text>

  <line x1="35" y1="468" x2="275" y2="468" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
  <text x="155" y="498" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="11" fill="#475569" text-anchor="middle">
    BIO PORTAL // SYSTEM
  </text>

  <!-- ==================== 3. BOTTOM RIGHT: RESERVED AREA ==================== -->
  <rect x="310" y="200" width="515" height="320" rx="10" fill="#090d16" stroke="#d4af37" stroke-width="1.4" />
  <rect x="325" y="215" width="485" height="290" rx="8" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 5" />

  <text x="567" y="365" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="12" fill="#334155" text-anchor="middle" letter-spacing="1">
    // RESERVED SPACE
  </text>
</svg>
